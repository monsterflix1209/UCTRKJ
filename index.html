<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RAF STATE OS · QWEN LIQUID GLASS</title>
    <style>
        /* ==========================================================================
           1. 彩色漸層流體玻璃視覺系統 (Fluid Gradient Glass Design System)
           ========================================================================== */
        :root {
            --glass-bg: rgba(255, 255, 255, 0.08);
            --glass-bg-hover: rgba(255, 255, 255, 0.14);
            --glass-border: rgba(255, 255, 255, 0.22);
            --glass-border-bright: rgba(255, 255, 255, 0.45);
            --glass-shadow: 0 30px 60px rgba(0, 0, 0, 0.45), inset 0 1px 1px rgba(255, 255, 255, 0.5), inset 0 -1px 2px rgba(0, 0, 0, 0.3);
            --text-main: #ffffff;
            --text-sub: rgba(255, 255, 255, 0.75);
            --text-muted: rgba(255, 255, 255, 0.45);
            --accent-cyan: #38bdf8;
            --accent-purple: #c084fc;
            --accent-pink: #f472b6;
            --radius-xl: 32px;
            --radius-lg: 20px;
            --radius-md: 12px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", sans-serif; -webkit-font-smoothing: antialiased; user-select: none; }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #030308;
            color: var(--text-main);
        }

        /* 絢麗彩色動態流體背景 Canvas */
        #fluidCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -2;
            filter: blur(60px) saturate(220%);
        }

        /* 全螢幕背景玻璃覆蓋層 */
        .glass-overlay {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0, 0, 0, 0.25);
            backdrop-filter: blur(20px) saturate(160%);
            -webkit-backdrop-filter: blur(20px) saturate(160%);
            z-index: -1;
        }

        /* ==========================================================================
           2. iOS 鎖定畫面 (Lock Screen)
           ========================================================================== */
        #lockScreen {
            position: fixed;
            inset: 0;
            z-index: 999;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 80px 20px 60px 20px;
            transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.6s ease;
        }

        .lock-clock {
            text-align: center;
        }
        .lock-date {
            font-size: 1.25rem;
            font-weight: 500;
            letter-spacing: 0.5px;
            color: rgba(255, 255, 255, 0.85);
            margin-bottom: 6px;
        }
        .lock-time {
            font-size: 6.5rem;
            font-weight: 200;
            letter-spacing: -2px;
            line-height: 1;
            background: linear-gradient(180deg, #ffffff 40%, rgba(255,255,255,0.6));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .unlock-hint {
            background: rgba(255, 255, 255, 0.12);
            border: 1px solid rgba(255, 255, 255, 0.3);
            backdrop-filter: blur(30px);
            padding: 14px 32px;
            border-radius: 40px;
            font-size: 0.95rem;
            letter-spacing: 1px;
            cursor: pointer;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            animation: pulseHint 2s infinite;
        }
        @keyframes pulseHint { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.04); } }

        /* ==========================================================================
           3. OS 主介面與頂部狀態列 (OS Top Bar & Desktop)
           ========================================================================== */
        #osDesktop {
            display: opacity: 0;
            pointer-events: none;
            height: 100vh;
            display: flex;
            flex-direction: column;
            transition: opacity 0.5s ease;
        }
        #osDesktop.active {
            opacity: 1;
            pointer-events: auto;
        }

        .top-bar {
            height: 48px;
            padding: 0 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255, 255, 255, 0.05);
            border-bottom: 1px solid var(--glass-border);
            backdrop-filter: blur(25px);
            font-size: 0.85rem;
            z-index: 10;
        }
        .ai-status-pill {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(255, 255, 255, 0.1);
            padding: 4px 12px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.25);
            font-size: 0.78rem;
        }
        .status-dot { width: 8px; height: 8px; border-radius: 50%; background: #e2e8f0; }
        .status-dot.active { background: #34d399; box-shadow: 0 0 10px #34d399; }
        .status-dot.loading { background: #fbbf24; animation: blink 1s infinite; }
        @keyframes blink { 50% { opacity: 0.3; } }

        /* 視窗控制中心 */
        .main-workspace {
            flex: 1;
            padding: 24px;
            overflow-y: auto;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        .glass-window {
            width: 100%;
            max-width: 1100px;
            min-height: 620px;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-xl);
            box-shadow: var(--glass-shadow);
            backdrop-filter: blur(50px) saturate(200%);
            -webkit-backdrop-filter: blur(50px) saturate(200%);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            animation: windowPop 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }
        @keyframes windowPop { from { opacity: 0; transform: scale(0.96) translateY(20px); } to { opacity: 1; transform: scale(1) translateY(0); } }

        .window-header {
            padding: 18px 24px;
            border-bottom: 1px solid var(--glass-border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(255, 255, 255, 0.03);
        }
        .window-title { font-size: 1.1rem; font-weight: 600; letter-spacing: -0.3px; }

        .app-nav {
            display: flex;
            gap: 10px;
            padding: 12px 24px;
            background: rgba(0, 0, 0, 0.15);
            border-bottom: 1px solid var(--glass-border);
            overflow-x: auto;
        }
        .app-tab {
            padding: 10px 20px;
            border-radius: var(--radius-md);
            background: transparent;
            border: 1px solid transparent;
            color: var(--text-sub);
            font-size: 0.88rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.25s ease;
            white-space: nowrap;
        }
        .app-tab:hover { background: rgba(255,255,255,0.08); color: #fff; }
        .app-tab.active {
            background: rgba(255, 255, 255, 0.18);
            border-color: var(--glass-border-bright);
            color: #fff;
            box-shadow: 0 8px 20px rgba(0,0,0,0.25), inset 0 1px 0 rgba(255,255,255,0.5);
        }

        .app-content { flex: 1; padding: 28px; display: none; }
        .app-content.active { display: block; }

        /* ==========================================================================
           4. Qwen AI 即時打字流（Streaming Chat Interface）
           ========================================================================== */
        .chat-container {
            display: flex;
            flex-direction: column;
            height: 500px;
            gap: 16px;
        }
        .chat-messages {
            flex: 1;
            background: rgba(0, 0, 0, 0.25);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-lg);
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }
        .message-bubble {
            max-width: 82%;
            padding: 14px 18px;
            border-radius: 18px;
            font-size: 0.92rem;
            line-height: 1.6;
            word-break: break-word;
            user-select: text;
        }
        .message-bubble.user {
            align-self: flex-end;
            background: linear-gradient(135deg, rgba(56, 189, 248, 0.35), rgba(192, 132, 252, 0.35));
            border: 1px solid var(--glass-border-bright);
            color: #fff;
        }
        .message-bubble.assistant {
            align-self: flex-start;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid var(--glass-border);
            color: var(--text-main);
            backdrop-filter: blur(15px);
        }
        .cursor-blink { display: inline-block; width: 6px; height: 15px; background: var(--accent-cyan); margin-left: 4px; vertical-align: middle; animation: blink 0.8s infinite; }

        .chat-input-bar {
            display: flex;
            gap: 12px;
        }
        .glass-input {
            flex: 1;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid var(--glass-border);
            padding: 16px 20px;
            border-radius: var(--radius-lg);
            color: #fff;
            outline: none;
            font-size: 0.95rem;
            transition: all 0.25s ease;
            user-select: text;
        }
        .glass-input:focus {
            background: rgba(255, 255, 255, 0.12);
            border-color: var(--glass-border-bright);
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.15);
        }
        .btn-fluid {
            background: linear-gradient(135deg, rgba(255,255,255,0.9), rgba(220,225,235,0.8));
            color: #000;
            font-weight: 600;
            border: none;
            padding: 0 28px;
            border-radius: var(--radius-lg);
            cursor: pointer;
            transition: all 0.25s ease;
            box-shadow: 0 8px 20px rgba(0,0,0,0.25);
        }
        .btn-fluid:hover { transform: translateY(-2px); opacity: 0.95; box-shadow: 0 12px 25px rgba(255,255,255,0.3); }
        .btn-fluid:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

        /* 模型下載進度條 */
        .progress-box {
            background: rgba(0,0,0,0.3);
            border: 1px solid var(--glass-border);
            padding: 16px;
            border-radius: var(--radius-md);
            margin-bottom: 12px;
        }
        .progress-bar-bg { width: 100%; height: 8px; background: rgba(255,255,255,0.1); border-radius: 4px; overflow: hidden; margin-top: 8px; }
        .progress-bar-fill { height: 100%; width: 0%; background: linear-gradient(90deg, var(--accent-cyan), var(--accent-purple)); transition: width 0.2s ease; }

        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
        @media (max-width: 820px) { .grid-2 { grid-template-columns: 1fr; } }

        /* 證件 Canvas */
        canvas.id-card { width: 100%; height: auto; border-radius: 20px; border: 1px solid var(--glass-border-bright); box-shadow: 0 20px 40px rgba(0,0,0,0.5); }
    </style>
</head>
<body>

<!-- 1. 動態彩色流體光暈背景 -->
<canvas id="fluidCanvas"></canvas>
<div class="glass-overlay"></div>

<!-- 2. iOS 鎖定畫面 -->
<div id="lockScreen">
    <div class="lock-clock">
        <div class="lock-date" id="lockDate">10月24日 星期六</div>

<!-- 3. 主作業系統桌面 -->
<div id="osDesktop">

    <div class="main-workspace">
        <div class="glass-window">
            <div class="window-header">

                <div style="display:flex; gap:8px;">
                    <span style="width:12px; height:12px; border-radius:50%; background:#ff5f56; display:inline-block;"></span>
                    <span style="width:12px; height:12px; border-radius:50%; background:#ffbd2e; display:inline-block;"></span>

            <!-- App 1: Qwen AI 即時打字對話 -->
            <div id="app-chat" class="app-content active">
                <div class="chat-container">
                    <div id="modelProgressBox" class="progress-box">
                        <div style="display:flex; justify-content:space-between; font-size:0.82rem; color:var(--text-sub);">
                            <span id="progressLabel">正在從 HuggingFace 下載 Qwen1.5-0.5B 本地模型...</span>
                            <span id="progressPercent">0%</span>
                        </div>
                        <div class="progress-bar-bg"><div id="progressBarFill" class="progress-bar-fill"></div></div>
                    </div>
                    <div class="chat-messages" id="chatMessages">
                        <div class="message-bubble assistant">
                            歡迎進入 RAF STATE OS。我是執行在您瀏覽器 CPU/GPU 上的 <b>Qwen (通義千問) 離線大語言模型</b>。我不依賴任何外部 API Key，請在下方輸入任意問題，我將為您進行即時 Token 流式打字回答。
                        </div>

<!-- 4. Qwen 本地 Web AI 引擎腳本 -->
<script type="module">
    import { pipeline, TextStreamer, env } from 'https://cdn.jsdelivr.net/npm/@xenova/transformers@2.17.2';

    env.allowLocalModels = false;
    let generator = null;

    // 啟動 Qwen 本地模型載入
    async function initQwenEngine() {
        const dot = document.getElementById('aiDot');
        const statusText = document.getElementById('aiStatusText');
        const pLabel = document.getElementById('progressLabel');
        const pFill = document.getElementById('progressBarFill');
        const pPercent = document.getElementById('progressPercent');

        try {
            generator = await pipeline('text-generation', 'Xenova/Qwen1.5-0.5B-Chat', {
                progress_callback: (p) => {
                    if (p.status === 'progress') {
                        const pct = Math.round(p.progress || 0);
                        pFill.style.width = pct + '%';
                        pPercent.innerText = pct + '%';
                        statusText.innerText = `Qwen 載入中 (${pct}%)`;
                    }
                }
            });

            dot.className = 'status-dot active';
            statusText.innerText = 'Qwen 本地 AI (已就緒)';
            document.getElementById('modelProgressBox').style.display = 'none';
            document.getElementById('sendBtn').disabled = false;
            document.getElementById('lawBtn').disabled = false;
        } catch (err) {
            console.error(err);
            pLabel.innerText = '模型載入失敗，請重新刷新頁面。';
            statusText.innerText = 'Qwen 載入失敗';
        }
    }

    // 即時打字流式對話核心
    window.sendChatMessage = async function() {
        const input = document.getElementById('userInput');
        const text = input.value.trim();
        if (!text || !generator) return;

        input.value = '';
        const messagesContainer = document.getElementById('chatMessages');

        // 渲染使用者 Bubble
        const userBubble = document.createElement('div');
        userBubble.className = 'message-bubble user';
        userBubble.innerText = text;
        messagesContainer.appendChild(userBubble);

        // 建立 Assistant 答案 Bubble
        const aiBubble = document.createElement('div');
        aiBubble.className = 'message-bubble assistant';
        const textSpan = document.createElement('span');
        const cursor = document.createElement('span');
        cursor.className = 'cursor-blink';
        aiBubble.appendChild(textSpan);
        aiBubble.appendChild(cursor);
        messagesContainer.appendChild(aiBubble);
        messagesContainer.scrollTop = messagesContainer.scrollHeight;

        // 構建 Prompt
        const prompt = `<|im_start|>user\n${text}<|im_end|>\n<|im_start|>assistant\n`;

        const streamer = new TextStreamer(generator.tokenizer, {
            skip_prompt: true,
            skip_special_tokens: true,
            callback_function: (outputToken) => {
                textSpan.innerText += outputToken;
                messagesContainer.scrollTop = messagesContainer.scrollHeight;
            }
        });

        document.getElementById('sendBtn').disabled = true;
        await generator(prompt, {
            max_new_tokens: 256,
            temperature: 0.7,
            streamer: streamer
        });
        cursor.remove();
        document.getElementById('sendBtn').disabled = false;
    };

    // AI 起草國會法案
    window.generateLawWithQwen = async function() {
        const topic = document.getElementById('lawTopicInput').value.trim();
        if (!topic || !generator) return;

        const outBox = document.getElementById('lawOutputBox');
        outBox.innerHTML = '';

        const aiBubble = document.createElement('div');
        aiBubble.className = 'message-bubble assistant';
        aiBubble.style.width = '100%';
        const textSpan = document.createElement('span');
        const cursor = document.createElement('span');
        cursor.className = 'cursor-blink';
        aiBubble.appendChild(textSpan);
        aiBubble.appendChild(cursor);
        outBox.appendChild(aiBubble);

        const prompt = `<|im_start|>user\n請為「${topic}」起草一份明確的國家法律條文草案。<|im_end|>\n<|im_start|>assistant\n`;

        const streamer = new TextStreamer(generator.tokenizer, {
            skip_prompt: true,
            skip_special_tokens: true,
            callback_function: (token) => {
                textSpan.innerText += token;
                outBox.scrollTop = outBox.scrollHeight;
            }
        });

        document.getElementById('lawBtn').disabled = true;
        await generator(prompt, { max_new_tokens: 300, temperature: 0.6, streamer });
        cursor.remove();
        document.getElementById('lawBtn').disabled = false;
    };

    window.addEventListener('load', initQwenEngine);
</script>

<!-- 5. 視覺流體 Canvas 與 OS 介面互動邏輯 -->
<script>
    // --- 彩色漸層流體 Canvas (Fluid Gradient Shader Simulator) ---
    const canvas = document.getElementById('fluidCanvas');
    const ctx = canvas.getContext('2d');
    let blobs = [];

    function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    class FluidBlob {
        constructor() {
            this.x = Math.random() * canvas.width;
            this.y = Math.random() * canvas.height;
            this.radius = Math.random() * 300 + 200;
            this.vx = (Math.random() - 0.5) * 1.2;
            this.vy = (Math.random() - 0.5) * 1.2;
            const colors = [
                'rgba(56, 189, 248, 0.45)',  // Cyan
                'rgba(192, 132, 252, 0.45)', // Purple
                'rgba(244, 114, 182, 0.4)',  // Pink
                'rgba(45, 212, 191, 0.35)'   // Teal
            ];
            this.color = colors[Math.floor(Math.random() * colors.length)];
        }
        update() {
            this.x += this.vx; this.y += this.vy;
            if (this.x < -100) this.x = canvas.width + 100;
            if (this.x > canvas.width + 100) this.x = -100;
            if (this.y < -100) this.y = canvas.height + 100;
            if (this.y > canvas.height + 100) this.y = -100;
        }
        draw() {
            ctx.beginPath();
            let grad = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, this.radius);
            grad.addColorStop(0, this.color);
            grad.addColorStop(1, 'rgba(0,0,0,0)');
            ctx.fillStyle = grad;
            ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
            ctx.fill();
        }
    }

    for (let i = 0; i < 7; i++) blobs.push(new FluidBlob());

    function renderFluid() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        blobs.forEach(b => { b.update(); b.draw(); });
        requestAnimationFrame(renderFluid);
    }
    renderFluid();

    // --- 時間與時鐘更新 ---
    function updateClock() {
        const now = new Date();
        const hrs = String(now.getHours()).padStart(2, '0');
        const mins = String(now.getMinutes()).padStart(2, '0');
        const timeStr = `${hrs}:${mins}`;

        document.getElementById('lockTime').innerText = timeStr;
        document.getElementById('desktopTime').innerText = timeStr;

        const options = { month: 'long', day: 'numeric', weekday: 'long' };
        document.getElementById('lockDate').innerText = now.toLocaleDateString('zh-TW', options);
    }
    setInterval(updateClock, 1000);
    updateClock();

    // --- 解鎖進入 OS ---
    function unlockOS() {
        const lockScreen = document.getElementById('lockScreen');
        lockScreen.style.transform = 'translateY(-100%)';
        lockScreen.style.opacity = '0';
        setTimeout(() => {
            lockScreen.style.display = 'none';
            document.getElementById('osDesktop').classList.add('active');
            drawPass();
            renderAssets();
        }, 500);
    }

    // --- App 切換 ---
    function switchApp(appId) {
        document.querySelectorAll('.app-tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.app-content').forEach(c => c.classList.remove('active'));

        document.getElementById(appId).classList.add('active');
        const tabBtn = Array.from(document.querySelectorAll('.app-tab')).find(b => b.getAttribute('onclick').includes(appId));
        if (tabBtn) tabBtn.classList.add('active');
    }

    // --- 通行證 Canvas 繪製 ---
    function drawPass() {
        const name = document.getElementById('passName').value || '未名公民';
        const sector = document.getElementById('passSector').value || '特區';
        const role = document.getElementById('passRole').value || '指揮官';

        const c = document.getElementById('passCanvas');
        if (!c) return;
        const ctx = c.getContext('2d');

        ctx.fillStyle = '#060810'; ctx.fillRect(0, 0, 480, 280);

        // 漸層外框
        let grad = ctx.createLinearGradient(0, 0, 480, 280);
        grad.addColorStop(0, '#38bdf8'); grad.addColorStop(1, '#c084fc');
        ctx.strokeStyle = grad; ctx.lineWidth = 2; ctx.strokeRect(12, 12, 456, 256);

        ctx.fillStyle = 'rgba(255, 255, 255, 0.08)'; ctx.fillRect(13, 13, 454, 46);
        ctx.fillStyle = '#ffffff'; ctx.font = '600 14px -apple-system, sans-serif';
        ctx.fillText('REPUBLIC OF ASIAN FEDERATION · PASS', 26, 42);

        ctx.font = '700 20px -apple-system, sans-serif'; ctx.fillText(name, 26, 105);
        ctx.fillStyle = 'rgba(255, 255, 255, 0.7)'; ctx.font = '13px -apple-system, sans-serif';
        ctx.fillText(`SECTOR : ${sector}`, 26, 142);
        ctx.fillText(`ROLE   : ${role}`, 26, 172);
        ctx.fillText(`STATUS : LEVEL 9 AUTHORIZED`, 26, 202);

        ctx.fillStyle = 'rgba(255, 255, 255, 0.4)'; ctx.font = '10px monospace';
        ctx.fillText(`TOKEN: RAF-OS-${Math.floor(Math.random()*899999+100000)}`, 26, 250);
    }

    function downloadPass() {
        const c = document.getElementById('passCanvas');
        const a = document.createElement('a');
        a.href = c.toDataURL('image/png');
        a.download = 'RAF_Holo_Pass.png';
        a.click();
    }

    // --- 國庫資產 LocalStorage 紀錄 ---
    let assets = JSON.parse(localStorage.getItem('raf_assets_v2')) || [
        { name: '極光級星際巡洋艦', val: '15,000,000 RAF' }
    ];

    function renderAssets() {
        const box = document.getElementById('assetListBox');
        if (assets.length === 0) { box.innerHTML = '<p style="color:var(--text-muted);">無登記資產。</p>'; return; }
        box.innerHTML = assets.map(a => `
            <div style="background:rgba(255,255,255,0.05); border:1px solid var(--glass-border); padding:12px; border-radius:12px; margin-bottom:10px;">
                <div style="font-weight:600; color:#fff;">${a.name}</div>
                <div style="font-size:0.8rem; color:var(--text-sub); margin-top:4px;">估值: ${a.val}</div>
            </div>
        `).join('');
    }

    function addAsset() {
        const name = document.getElementById('assetName').value.trim();
        const val = document.getElementById('assetVal').value.trim();
        if(!name || !val) return alert('請填寫資產資訊');
        assets.push({name, val});
        localStorage.setItem('raf_assets_v2', JSON.stringify(assets));
        renderAssets();
    }
</script>
