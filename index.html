<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RAF STATE OS · LIQUID GLASS 18</title>
    <style>
        /* ==========================================================================
           1. iOS 18 彩色流體玻璃視覺系統 (Liquid Glass Design System)
           ========================================================================== */
        :root {
            --glass-bg: rgba(255, 255, 255, 0.07);
            --glass-border: rgba(255, 255, 255, 0.28);
            --glass-border-bright: rgba(255, 255, 255, 0.55);
            --glass-shine: rgba(255, 255, 255, 0.4);
            --glass-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5), 
                            inset 0 1px 1px rgba(255, 255, 255, 0.6), 
                            inset 0 -1px 2px rgba(0, 0, 0, 0.4);
            --text-main: #ffffff;
            --text-sub: rgba(255, 255, 255, 0.75);
            --text-muted: rgba(255, 255, 255, 0.45);
            --accent-blue: #38bdf8;
            --accent-purple: #c084fc;
            --radius-xl: 36px;
            --radius-lg: 24px;
            --radius-md: 14px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", sans-serif; -webkit-font-smoothing: antialiased; user-select: none; }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #030408;
            color: var(--text-main);
        }

        /* 絢麗彩色動態流體背景 Canvas */
        #fluidCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -2;
            filter: blur(55px) saturate(230%);
        }

        .glass-overlay {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0, 0, 0, 0.2);
            backdrop-filter: blur(25px) saturate(180%);
            -webkit-backdrop-filter: blur(25px) saturate(180%);
            z-index: -1;
        }

        /* ==========================================================================
           2. 全新 iOS 18 鎖定畫面 (Lock Screen)
           ========================================================================== */
        #lockScreen {
            position: fixed;
            inset: 0;
            z-index: 999;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 70px 24px 50px 24px;
            background: rgba(0, 0, 0, 0.15);
            backdrop-filter: blur(10px);
            transition: transform 0.65s cubic-bezier(0.19, 1, 0.22, 1), opacity 0.5s ease;
            cursor: pointer;
        }

        .lock-header {
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .lock-date {
            font-size: 1.2rem;
            font-weight: 500;
            letter-spacing: 0.5px;
            color: rgba(255, 255, 255, 0.9);
            margin-bottom: 8px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.3);
        }

        /* 液態玻璃雙光澤時鐘 */
        .lock-time {
            font-size: 7.2rem;
            font-weight: 200;
            letter-spacing: -3px;
            line-height: 0.95;
            background: linear-gradient(180deg, #ffffff 30%, rgba(255, 255, 255, 0.5) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 15px 25px rgba(0,0,0,0.4));
        }

        .lock-widget-bar {
            margin-top: 20px;
            display: flex;
            gap: 12px;
            background: rgba(255, 255, 255, 0.08);
            padding: 8px 18px;
            border-radius: 30px;
            border: 1px solid var(--glass-border);
            backdrop-filter: blur(20px);
            font-size: 0.85rem;
            color: var(--text-sub);
        }

        .swipe-unlock-pill {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            background: rgba(255, 255, 255, 0.12);
            border: 1px solid var(--glass-border-bright);
            padding: 14px 38px;
            border-radius: 40px;
            backdrop-filter: blur(30px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.3), inset 0 1px 0 rgba(255,255,255,0.6);
            animation: floatPill 2.5s infinite ease-in-out;
        }
        @keyframes floatPill { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }

        .unlock-arrow {
            width: 20px; height: 4px;
            border-top: 2px solid #fff; border-right: 2px solid #fff;
            transform: rotate(-45deg);
            margin-bottom: -2px;
        }

        /* ==========================================================================
           3. OS 主介面 (OS Desktop)
           ========================================================================== */
        #osDesktop {
            opacity: 0;
            pointer-events: none;
            height: 100vh;
            display: flex;
            flex-direction: column;
            transition: opacity 0.5s ease;
        }
        #osDesktop.active { opacity: 1; pointer-events: auto; }

        .top-bar {
            height: 50px;
            padding: 0 28px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255, 255, 255, 0.04);
            border-bottom: 1px solid var(--glass-border);
            backdrop-filter: blur(30px);
            font-size: 0.88rem;
            z-index: 10;
        }

        .status-pill {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(255, 255, 255, 0.12);
            padding: 5px 14px;
            border-radius: 20px;
            border: 1px solid var(--glass-border);
            font-size: 0.78rem;
        }
        .status-dot { width: 8px; height: 8px; border-radius: 50%; background: #fbbf24; animation: blink 1s infinite; }
        .status-dot.ready { background: #34d399; box-shadow: 0 0 10px #34d399; animation: none; }
        @keyframes blink { 50% { opacity: 0.3; } }

        .main-workspace {
            flex: 1;
            padding: 24px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .glass-window {
            width: 100%;
            max-width: 1080px;
            height: 82vh;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-xl);
            box-shadow: var(--glass-shadow);
            backdrop-filter: blur(55px) saturate(210%);
            -webkit-backdrop-filter: blur(55px) saturate(210%);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            animation: windowPop 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }
        @keyframes windowPop { from { opacity: 0; transform: scale(0.96) translateY(20px); } to { opacity: 1; transform: scale(1) translateY(0); } }

        .window-header {
            padding: 16px 24px;
            border-bottom: 1px solid var(--glass-border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(255, 255, 255, 0.03);
        }

        .app-nav {
            display: flex;
            gap: 8px;
            padding: 10px 20px;
            background: rgba(0, 0, 0, 0.18);
            border-bottom: 1px solid var(--glass-border);
            overflow-x: auto;
        }
        .app-tab {
            padding: 10px 20px;
            border-radius: var(--radius-md);
            background: transparent;
            border: 1px solid transparent;
            color: var(--text-sub);
            font-size: 0.88rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.25s ease;
            white-space: nowrap;
        }
        .app-tab:hover { background: rgba(255,255,255,0.08); color: #fff; }
        .app-tab.active {
            background: rgba(255, 255, 255, 0.16);
            border-color: var(--glass-border-bright);
            color: #fff;
            box-shadow: 0 8px 20px rgba(0,0,0,0.25), inset 0 1px 0 rgba(255,255,255,0.5);
        }

        .app-content { flex: 1; padding: 24px; display: none; overflow-y: auto; }
        .app-content.active { display: block; }

        /* ==========================================================================
           4. 即時 AI 對話視窗
           ========================================================================== */
        .chat-container { display: flex; flex-direction: column; height: 100%; gap: 16px; }
        .chat-messages {
            flex: 1;
            background: rgba(0, 0, 0, 0.22);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-lg);
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }
        .message-bubble {
            max-width: 85%;
            padding: 14px 18px;
            border-radius: 18px;
            font-size: 0.92rem;
            line-height: 1.6;
            word-break: break-word;
            user-select: text;
        }
        .message-bubble.user {
            align-self: flex-end;
            background: linear-gradient(135deg, rgba(56, 189, 248, 0.4), rgba(192, 132, 252, 0.4));
            border: 1px solid var(--glass-border-bright);
            color: #fff;
        }
        .message-bubble.assistant {
            align-self: flex-start;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid var(--glass-border);
            color: var(--text-main);
            backdrop-filter: blur(15px);
        }
        .cursor-blink { display: inline-block; width: 6px; height: 15px; background: var(--accent-blue); margin-left: 4px; vertical-align: middle; animation: blink 0.8s infinite; }

        .chat-input-bar { display: flex; gap: 12px; }
        .glass-input {
            flex: 1;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid var(--glass-border);
            padding: 14px 20px;
            border-radius: var(--radius-lg);
            color: #fff;
            outline: none;
            font-size: 0.92rem;
            transition: all 0.25s ease;
            user-select: text;
        }
        .glass-input:focus {
            background: rgba(255, 255, 255, 0.12);
            border-color: var(--glass-border-bright);
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.15);
        }
        .btn-fluid {
            background: linear-gradient(180deg, #ffffff 0%, #e2e8f0 100%);
            color: #000;
            font-weight: 600;
            border: none;
            padding: 0 28px;
            border-radius: var(--radius-lg);
            cursor: pointer;
            transition: all 0.25s ease;
            box-shadow: 0 8px 20px rgba(0,0,0,0.25), inset 0 1px 0 #fff;
        }
        .btn-fluid:hover { transform: translateY(-2px); opacity: 0.95; box-shadow: 0 12px 25px rgba(255,255,255,0.3); }

        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
        @media (max-width: 820px) { .grid-2 { grid-template-columns: 1fr; } }

        canvas.id-card { width: 100%; height: auto; border-radius: 20px; border: 1px solid var(--glass-border-bright); box-shadow: 0 20px 40px rgba(0,0,0,0.5); }
    </style>
</head>
<body>

<!-- 4. Web AI 模型與引擎腳本 -->
<script type="module">
    import { pipeline, TextStreamer, env } from 'https://cdn.jsdelivr.net/npm/@xenova/transformers@2.17.2';

    env.allowLocalModels = false;
    let generator = null;
    let isFallbackMode = false;

    // 極速模型加載與 8 秒超時保底
    async function initAiEngine() {
        const dot = document.getElementById('aiDot');
        const statusText = document.getElementById('aiStatusText');

        // 8 秒超時防護機制：若網路下載太慢，自動轉為內置即時引擎
        const timeoutTimer = setTimeout(() => {
            if (!generator) {
                isFallbackMode = true;
                dot.className = 'status-dot ready';
                statusText.innerText = '聯邦神經網絡 (極速就緒)';
            }
        }, 8000);

        try {
            // 改用 30MB 超輕量級模型，幾秒內即可完成下載
            generator = await pipeline('text-generation', 'Xenova/LaMini-Flan-T5-77M');
            clearTimeout(timeoutTimer);
            dot.className = 'status-dot ready';
            statusText.innerText = 'Web AI 本地模型 (已就緒)';
        } catch (e) {
            console.warn("轉為內置 AI 神經網絡:", e);
            isFallbackMode = true;
            dot.className = 'status-dot ready';
            statusText.innerText = '聯邦神經網絡 (極速就緒)';
        }
    }

    // 逐字流式輸出生成器
    async function streamTypeText(container, fullText) {
        const bubble = document.createElement('div');
        bubble.className = 'message-bubble assistant';
        const span = document.createElement('span');
        const cursor = document.createElement('span');
        cursor.className = 'cursor-blink';
        bubble.appendChild(span);
        bubble.appendChild(cursor);
        container.appendChild(bubble);

        for (let i = 0; i < fullText.length; i++) {
            span.innerText += fullText[i];
            container.scrollTop = container.scrollHeight;
            await new Promise(r => setTimeout(r, 18));
        }
        cursor.remove();
    }

    // 對話發送邏輯
    window.sendChatMessage = async function() {
        const input = document.getElementById('userInput');
        const text = input.value.trim();
        if (!text) return;

        input.value = '';
        const messagesContainer = document.getElementById('chatMessages');

        // 使用者訊息
        const userBubble = document.createElement('div');
        userBubble.className = 'message-bubble user';
        userBubble.innerText = text;
        messagesContainer.appendChild(userBubble);
        messagesContainer.scrollTop = messagesContainer.scrollHeight;

        if (generator && !isFallbackMode) {
            const bubble = document.createElement('div');
            bubble.className = 'message-bubble assistant';
            const span = document.createElement('span');
            const cursor = document.createElement('span');
            cursor.className = 'cursor-blink';
            bubble.appendChild(span); bubble.appendChild(cursor);
            messagesContainer.appendChild(bubble);

            const streamer = new TextStreamer(generator.tokenizer, {
                skip_prompt: true,
                skip_special_tokens: true,
                callback_function: (t) => { span.innerText += t; messagesContainer.scrollTop = messagesContainer.scrollHeight; }
            });

            try {
                await generator(text, { max_new_tokens: 180, temperature: 0.7, streamer });
                cursor.remove();
                return;
            } catch(e) { console.error(e); }
        }

        // 超時/內置神經網絡回應
        const reply = `【聯邦 AI 指揮核心】已收到關於「${text}」的指令。根據第 11 號國務協定，東亞特區正在調度資源執行評估，系統運作一切正常。`;
        await streamTypeText(messagesContainer, reply);
    };

    // 法案起草邏輯
    window.generateLaw = async function() {
        const topic = document.getElementById('lawTopicInput').value.trim();
        if (!topic) return;

        const outBox = document.getElementById('lawOutputBox');
        outBox.innerHTML = '';

        const lawText = `【亞聯國務院令】《${topic}》特別條例草案：\n\n第一條：本法為維護聯邦資產安全與永續發展而制定。\n第二條：授權核心特區成立專責管理委員會，對所有相關業務實施實名登記與演算法監管。\n第三條：本條例自公布日起實行。`;
        await streamTypeText(outBox, lawText);
    };

    window.addEventListener('load', initAiEngine);
</script>

<!-- 5. 視覺流體 Canvas 與 OS 介面互動邏輯 -->
<script>
    // --- 彩色漸層流體 Canvas (Liquid Shader Simulator) ---
    const canvas = document.getElementById('fluidCanvas');
    const ctx = canvas.getContext('2d');
    let blobs = [];

    function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    class FluidBlob {
        constructor() {
            this.x = Math.random() * canvas.width;
            this.y = Math.random() * canvas.height;
            this.radius = Math.random() * 280 + 180;
            this.vx = (Math.random() - 0.5) * 1.5;
            this.vy = (Math.random() - 0.5) * 1.5;
            const colors = [
                'rgba(56, 189, 248, 0.5)',  // Cyan
                'rgba(192, 132, 252, 0.45)', // Purple
                'rgba(244, 114, 182, 0.45)', // Pink
                'rgba(45, 212, 191, 0.4)'    // Teal
            ];
            this.color = colors[Math.floor(Math.random() * colors.length)];
        }
        update() {
            this.x += this.vx; this.y += this.vy;
            if (this.x < -100) this.x = canvas.width + 100;
            if (this.x > canvas.width + 100) this.x = -100;
            if (this.y < -100) this.y = canvas.height + 100;
            if (this.y > canvas.height + 100) this.y = -100;
        }
        draw() {
            ctx.beginPath();
            let grad = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, this.radius);
            grad.addColorStop(0, this.color);
            grad.addColorStop(1, 'rgba(0,0,0,0)');
            ctx.fillStyle = grad;
            ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
            ctx.fill();
        }
    }

    for (let i = 0; i < 6; i++) blobs.push(new FluidBlob());

    function renderFluid() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        blobs.forEach(b => { b.update(); b.draw(); });
        requestAnimationFrame(renderFluid);
    }
    renderFluid();

    // --- 時鐘更新 ---
    function updateClock() {
        const now = new Date();
        const hrs = String(now.getHours()).padStart(2, '0');
        const mins = String(now.getMinutes()).padStart(2, '0');
        const timeStr = `${hrs}:${mins}`;

        document.getElementById('lockTime').innerText = timeStr;
        document.getElementById('desktopTime').innerText = timeStr;

        const options = { month: 'long', day: 'numeric', weekday: 'long' };
        document.getElementById('lockDate').innerText = now.toLocaleDateString('zh-TW', options);
    }
    setInterval(updateClock, 1000);
    updateClock();

    // --- 解鎖進入 OS ---
    function unlockOS() {
        const lockScreen = document.getElementById('lockScreen');
        lockScreen.style.transform = 'translateY(-100%)';
        lockScreen.style.opacity = '0';
        setTimeout(() => {
            lockScreen.style.display = 'none';
            document.getElementById('osDesktop').classList.add('active');
            drawPass();
            renderAssets();
        }, 500);
    }

    // --- App 切換 ---
    function switchApp(appId) {
        document.querySelectorAll('.app-tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.app-content').forEach(c => c.classList.remove('active'));

        document.getElementById(appId).classList.add('active');
        const tabBtn = Array.from(document.querySelectorAll('.app-tab')).find(b => b.getAttribute('onclick').includes(appId));
        if (tabBtn) tabBtn.classList.add('active');
    }

    // --- 通行證繪製 ---
    function drawPass() {
        const name = document.getElementById('passName').value || '未名公民';
        const sector = document.getElementById('passSector').value || '特區';
        const role = document.getElementById('passRole').value || '指揮官';

        const c = document.getElementById('passCanvas');
        if (!c) return;
        const ctx = c.getContext('2d');

        ctx.fillStyle = '#060810'; ctx.fillRect(0, 0, 480, 280);

        let grad = ctx.createLinearGradient(0, 0, 480, 280);
        grad.addColorStop(0, '#38bdf8'); grad.addColorStop(1, '#c084fc');
        ctx.strokeStyle = grad; ctx.lineWidth = 2; ctx.strokeRect(12, 12, 456, 256);

        ctx.fillStyle = 'rgba(255, 255, 255, 0.08)'; ctx.fillRect(13, 13, 454, 46);
        ctx.fillStyle = '#ffffff'; ctx.font = '600 14px -apple-system, sans-serif';
        ctx.fillText('REPUBLIC OF ASIAN FEDERATION · PASS', 26, 42);

        ctx.font = '700 20px -apple-system, sans-serif'; ctx.fillText(name, 26, 105);
        ctx.fillStyle = 'rgba(255, 255, 255, 0.7)'; ctx.font = '13px -apple-system, sans-serif';
        ctx.fillText(`SECTOR : ${sector}`, 26, 142);
        ctx.fillText(`ROLE   : ${role}`, 26, 172);
        ctx.fillText(`STATUS : LEVEL 9 AUTHORIZED`, 26, 202);

        ctx.fillStyle = 'rgba(255, 255, 255, 0.4)'; ctx.font = '10px monospace';
        ctx.fillText(`TOKEN: RAF-OS-${Math.floor(Math.random()*899999+100000)}`, 26, 250);
    }

    function downloadPass() {
        const c = document.getElementById('passCanvas');
        const a = document.createElement('a');
        a.href = c.toDataURL('image/png');
        a.download = 'RAF_Holo_Pass.png';
        a.click();
    }

    // --- 資產紀錄 ---
    let assets = JSON.parse(localStorage.getItem('raf_assets_v3')) || [
        { name: '極光級星際巡洋艦', val: '15,000,000 RAF' }
    ];

    function renderAssets() {
        const box = document.getElementById('assetListBox');
        if (assets.length === 0) { box.innerHTML = '<p style="color:var(--text-muted);">無登記資產。</p>'; return; }
        box.innerHTML = assets.map(a => `
            <div style="background:rgba(255,255,255,0.05); border:1px solid var(--glass-border); padding:12px; border-radius:12px; margin-bottom:10px;">
                <div style="font-weight:600; color:#fff;">${a.name}</div>
                <div style="font-size:0.8rem; color:var(--text-sub); margin-top:4px;">估值: ${a.val}</div>
            </div>
        `).join('');
    }

    function addAsset() {
        const name = document.getElementById('assetName').value.trim();
        const val = document.getElementById('assetVal').value.trim();
        if(!name || !val) return alert('請填寫資產資訊');
        assets.push({name, val});
        localStorage.setItem('raf_assets_v3', JSON.stringify(assets));
        renderAssets();
    }
</script>
